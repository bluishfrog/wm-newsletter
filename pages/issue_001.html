<body data-page="issue_001">
    <div id="gate" class="gate">
        <div class="gate-card">
            <div class="eyebrow">Somewhere in the Deep Dark</div>
            <h1>Welcome in.</h1>
            <p>Enter the password to take a look around.</p>
            <form id="password-form"><label for="password" class="eyebrow">Password</label><input id="password"
                    type="password" autocomplete="current-password" required autofocus><button class="btn"

                <div id="error" class="error" role="alert"></div>
            </form>
        </div>
    </div>
    <div id="site-shell" class="hidden">
        <div id="header"></div>
        <main id="main"></main>
        <div id="footer"></div>
    </div>

    <script src="../assets/js/content.js"></script>
    <script src="../assets/js/app.js"></script>
